<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Create an account on the education platform."
    >

    <meta
        name="robots"
        content="noindex,nofollow"
    >

    <title>Create Account | Education Platform</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layouts.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
</head>

<body>

    <div id="site-navbar"></div>

    <main>

        <section class="content-section">
            <div class="container">

                <div class="content-width content-width--small">

                    <p class="eyebrow">
                        Account
                    </p>

                    <h1>
                        Create an Account
                    </h1>

                    <p>
                        Create your account to begin your
                        learning journey.
                    </p>

                    <form
                        id="register-form"
                        class="form"
                        novalidate
                    >

                        <div class="form-group">

                            <label for="register-name">
                                Full Name
                            </label>

                            <input
                                id="register-name"
                                name="name"
                                type="text"
                                autocomplete="name"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label for="register-email">
                                Email
                            </label>

                            <input
                                id="register-email"
                                name="email"
                                type="email"
                                autocomplete="email"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label for="register-password">
                                Password
                            </label>

                            <input
                                id="register-password"
                                name="password"
                                type="password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >

                            <small>
                                Password must contain at least
                                8 characters.
                            </small>

                        </div>

                        <div class="form-group">

                            <label for="register-confirm-password">
                                Confirm Password
                            </label>

                            <input
                                id="register-confirm-password"
                                name="confirm_password"
                                type="password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label>
                                <input
                                    id="register-terms"
                                    name="terms"
                                    type="checkbox"
                                    required
                                >

                                I agree to the platform's
                                terms and policies.
                            </label>

                        </div>

                        <button
                            type="submit"
                            class="button button--primary"
                        >
                            Create Account
                        </button>

                        <div
                            id="register-form-state"
                            class="state"
                            aria-live="polite"
                            hidden
                        ></div>

                    </form>

                    <p>
                        Already have an account?
                        <a href="login.html">
                            Sign in
                        </a>
                    </p>

                </div>

            </div>
        </section>

    </main>

    <div id="site-footer"></div>

    <script src="js/components/navbar.js" defer></script>
    <script src="js/components/footer.js" defer></script>

</body>
</html>
